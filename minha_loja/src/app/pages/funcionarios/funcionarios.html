
<section class="pagina-funcionarios">
  <h2>Cadastro de funcionários</h2>
  <p class="introducao">
    Cadastre os profissionais da Estética &amp; Bem-Estar.
  </p>

  <form #formulario="ngForm" (ngSubmit)="salvarFuncionario()">
    <div class="campo">
      <label for="nome">Nome completo</label>
      <input
        id="nome"
        name="nome"
        type="text"
        [(ngModel)]="funcionario.nome"
        required
      />
    </div>

    <div class="campo">
      <label for="cpf">CPF</label>
      <input
        id="cpf"
        name="cpf"
        type="text"
        [(ngModel)]="funcionario.cpf"
        required
      />
    </div>

    <div class="campo">
      <label for="email">E-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="funcionario.email"
        required
      />
    </div>

    <div class="campo">
      <label for="telefone">Telefone</label>
      <input
        id="telefone"
        name="telefone"
        type="tel"
        [(ngModel)]="funcionario.telefone"
        required
      />
    </div>

    <div class="campo">
      <label for="cargo">Cargo</label>
      <input
        id="cargo"
        name="cargo"
        type="text"
        [(ngModel)]="funcionario.cargo"
        placeholder="Ex.: Esteticista"
        required
      />
    </div>

    <div class="campo">
      <label for="dataAdmissao">Data de admissão</label>
      <input
        id="dataAdmissao"
        name="dataAdmissao"
        type="date"
        [(ngModel)]="funcionario.dataAdmissao"
        required
      />
    </div>

    @if (mensagem) {
      <p class="mensagem" role="status">{{ mensagem }}</p>
    }

    <div class="acoes">
      <button type="submit">Validar cadastro</button>
      <button type="button" (click)="limparFormulario()">
        Limpar formulário
      </button>
    </div>
  </form>
</section>
