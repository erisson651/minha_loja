
<section class="cadastro">
  <h2>Cadastro de clientes</h2>
  <p class="introducao">
    Preencha seus dados para se cadastrar na Estética &amp; Bem-Estar.
  </p>

  <form #formulario="ngForm" (ngSubmit)="salvarCliente()">
    <fieldset>
      <legend>Dados pessoais</legend>

      <div class="campos">
        <label>
          Nome completo *
          <input
            type="text"
            name="nome"
            [(ngModel)]="cliente.nome"
            required
            minlength="3"
            placeholder="Digite seu nome completo"
          />
        </label>

        <label>
          CPF *
          <input
            type="text"
            name="cpf"
            [(ngModel)]="cliente.cpf"
            required
            maxlength="14"
            placeholder="000.000.000-00"
          />
        </label>

        <label>
          Data de nascimento *
          <input
            type="date"
            name="dataNascimento"
            [(ngModel)]="cliente.dataNascimento"
            required
          />
        </label>

        <label>
          Sexo *
          <select name="sexo" [(ngModel)]="cliente.sexo" required>
            <option value="">Selecione</option>
            <option value="F">Feminino</option>
            <option value="M">Masculino</option>
            <option value="O">Outro</option>
            <option value="N">Prefiro não informar</option>
          </select>
        </label>

        <label>
          E-mail *
          <input
            type="email"
            name="email"
            [(ngModel)]="cliente.email"
            required
            email
            placeholder="seuemail@exemplo.com"
          />
        </label>

        <label>
          Telefone *
          <input
            type="tel"
            name="telefone"
            [(ngModel)]="cliente.telefone"
            required
            placeholder="(00) 00000-0000"
          />
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Endereço</legend>

      <div class="campos">
        <label>
          CEP *
          <input
            type="text"
            name="cep"
            [(ngModel)]="cliente.cep"
            required
            maxlength="9"
            placeholder="00000-000"
          />
        </label>

        <label>
          Rua / Logradouro *
          <input
            type="text"
            name="rua"
            [(ngModel)]="cliente.rua"
            required
            placeholder="Nome da rua"
          />
        </label>

        <label>
          Número *
          <input
            type="text"
            name="numero"
            [(ngModel)]="cliente.numero"
            required
            placeholder="Número"
          />
        </label>

        <label>
          Bairro *
          <input
            type="text"
            name="bairro"
            [(ngModel)]="cliente.bairro"
            required
            placeholder="Nome do bairro"
          />
        </label>

        <label>
          Cidade *
          <input
            type="text"
            name="cidade"
            [(ngModel)]="cliente.cidade"
            required
            placeholder="Nome da cidade"
          />
        </label>

        <label>
          Estado (UF) *
          <input
            type="text"
            name="uf"
            [(ngModel)]="cliente.uf"
            required
            maxlength="2"
            placeholder="SE"
          />
        </label>
      </div>
    </fieldset>

    @if (mensagem) {
      <p class="mensagem" role="status">{{ mensagem }}</p>
    }

    <div class="acoes">
      <button type="submit" [disabled]="salvando">
        {{ salvando ? 'Salvando...' : 'Cadastrar cliente' }}
      </button>
      <button type="button" class="secundario" (click)="limparFormulario()">
        Limpar
      </button>
      <a routerLink="/inicio">Voltar ao catálogo</a>
    </div>
  </form>
</section>
